    <!--
      AWS S3/CloudFront SPA deploy:
      - Faça build: npm run build
      - Suba o conteúdo da pasta dist/ para o bucket S3 (habilite como site estático)
      - Configure index document: index.html
      - Configure error document: index.html (para SPA routing)
      - No CloudFront, aponte para o bucket S3 e ative "Redirect HTTP to HTTPS"
      - Para cache busting, mantenha assets com hash (default do Vite)
      - Caminhos de favicon/logo já são absolutos para raiz do domínio
    -->
